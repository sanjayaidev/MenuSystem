<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Red House Catering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Noto+Naskh+Arabic:wght@500;700&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">
<!-- first frame of the hero shows instantly; the menu page is fetched in the background -->
<link rel="preload" as="image" href="demo/hero-poster.jpg">
<link rel="prefetch" href="menu-page.html">
<style>
  :root{ --gold:#e3b23c; --text:#f4efe6; --line:#2c2925; }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0; background:#000; color:var(--text);}
  body{display:flex; align-items:center; justify-content:center; overflow:hidden; font-family:'Poppins',sans-serif;}
/* floating WhatsApp button over the video */
.wa-fab{
  position:absolute; right:5%; bottom:4%; z-index:3;
  width:calc(var(--fw)*.14); height:calc(var(--fw)*.14); border-radius:50%;
  background:#25D366; color:#fff; display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 14px rgba(0,0,0,.5); text-decoration:none; -webkit-tap-highlight-color:transparent;
}
.wa-fab svg{width:58%; height:58%;}
.wa-fab:active{transform:scale(.94);}
  /* ONE 9:16 page (IG / TikTok). --fw = frame width, everything inside scales from it. */
  .frame{
    --fw:min(100vw, calc(100vh*9/16));
    --fw:min(100vw, calc(100svh*9/16));
    width:var(--fw); aspect-ratio:9/16; position:relative; overflow:hidden; background:#000;
    display:flex; flex-direction:column;
  }

  /* A — logo */
  .sec-a{flex:0 0 13%; min-height:0; overflow:hidden; display:flex; align-items:center; justify-content:center;}
  .sec-a img{width:100%; height:100%; object-fit:contain; display:block;}

  /* B — text (supplied by the client; Arabic + English as in the layout) */
  .sec-b{flex:0 0 7%; min-height:0; overflow:hidden; display:flex; flex-direction:column; justify-content:center; align-items:flex-end; padding:0 6%; line-height:1.15;}
  .sec-b .b-ar{font-family:'Noto Naskh Arabic','Poppins',sans-serif; font-weight:700; color:var(--gold); font-size:calc(var(--fw)*.05);}
  .sec-b .b-en{font-weight:600; color:var(--gold); letter-spacing:.06em; font-size:calc(var(--fw)*.027); text-transform:uppercase;}

  /* C — autoplay video, first frame is the poster */
  .sec-c{position:relative; flex:1 1 auto; min-height:0; background:#000;}
  .sec-c video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 60%; display:block; background:#000;}

  /* D — menu pills: their own black strip BELOW the video (never over it) */
  .sec-d{flex:0 0 10%; min-height:0; display:flex; align-items:center; background:#000;}
  .pills{width:100%; display:flex; gap:2.5%; padding:0 5%;}
  .pill{
    flex:1 1 0; min-width:0; display:flex; align-items:center; justify-content:center; text-decoration:none;
    height:calc(var(--fw)*.115); border-radius:999px; font-weight:700; color:var(--gold);
    background:rgba(0,0,0,.72); border:1px solid rgba(227,178,60,.55);
    font-size:calc(var(--fw)*.05); -webkit-tap-highlight-color:transparent;
    transition:background .15s ease,color .15s ease;
  }
  .pill:first-child{background:var(--gold); color:#1a1408; border-color:var(--gold);}
  .pill:active{background:var(--gold); color:#1a1408;}
  .pill[data-lang="ar"]{font-family:'Noto Naskh Arabic','Poppins',sans-serif; font-size:calc(var(--fw)*.058);}
  .pill[data-lang="zh"]{font-family:'Noto Sans SC','Poppins',sans-serif;}
</style>
</head>
<body>
<main class="frame">

  <!-- A: logo (replace images/page1-logo.png with the high-res file) -->
  <header class="sec-a"><img src="images/page1-logo.png" alt="Red House Catering"></header>

  <!-- B: text -->
  <section class="sec-b" aria-label="Cuisine">
    <span class="b-ar" lang="ar" dir="rtl">المطبخ الصيني</span>
    <span class="b-en">Chinese Cuisine</span>
  </section>

  <!-- C: 4-second autoplay loop. No scrub, no scroll control. -->
  <section class="sec-c">
    <video id="heroVideo" autoplay muted loop playsinline preload="auto" poster="demo/hero-poster.jpg" aria-hidden="true"></video>
 <a class="wa-fab" id="waFab" href="https://wa.me/966569283982" target="_blank" rel="noopener" aria-label="WhatsApp">
  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
</a>
  </section>

  <!-- D: MENU in 3 languages -> each opens the menu page in that language -->
  <section class="sec-d">
    <nav class="pills" aria-label="Menu">
      <a class="pill" data-lang="en" href="menu-page.html?lang=en" lang="en">MENU</a>
      <a class="pill" data-lang="ar" href="menu-page.html?lang=ar" lang="ar" dir="rtl">المنيو</a>
      <a class="pill" data-lang="zh" href="menu-page.html?lang=zh" lang="zh">菜单</a>
    </nav>
  </section>

</main>

<script>
/* remember the chosen language so the menu page opens in it (also passed as ?lang=) */
document.querySelectorAll('.pill').forEach(function(a){
  a.addEventListener('click', function(){
    try{ localStorage.setItem('redhouse_lang', a.dataset.lang); }catch(_){}
  });
});

/* hero video: poster (= first frame) is already on screen; the video starts as soon as
   its first bytes arrive (faststart mp4), without waiting for the whole file. */
(async function(){
  var v = document.getElementById('heroVideo');
  var DEFAULT_SRC = 'demo/hero.mp4', DEFAULT_POSTER = 'demo/hero-poster.jpg';
  var src = DEFAULT_SRC;
  try{
    var ctl = new AbortController(), t = setTimeout(function(){ ctl.abort(); }, 1500);
    var r = await fetch('/api/banner', { cache:'no-store', signal:ctl.signal });
    clearTimeout(t);
    if(r.ok){
      var m = await r.json();
      if(m.heroUrl){ src = m.heroUrl; if(m.heroPosterUrl) v.poster = m.heroPosterUrl; }
    }
  }catch(_){ /* API slow or down: use the bundled clip */ }
  v.addEventListener('error', function(){
    if(v.dataset.fb) return;
    v.dataset.fb = '1'; v.poster = DEFAULT_POSTER; v.src = DEFAULT_SRC; v.load();
  });
  v.muted = true;
  v.src = src;
  var go = function(){ var p = v.play(); if(p && p.catch) p.catch(function(){ /* autoplay blocked: poster stays */ }); };
  go();
  ['touchstart','pointerdown'].forEach(function(e){ addEventListener(e, go, { once:true, passive:true }); });
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) go(); });
})();
/* WhatsApp button: use the number saved in Admin -> Contact */
(async function(){
  try{
    var r = await fetch('/api/contact', { cache:'no-store' });
    if(!r.ok) return;
    var c = await r.json();
    var d = String(c.phone || '').replace(/\D/g, '');
    if(d.startsWith('00')) d = d.slice(2);
    else if(d.startsWith('0')) d = '966' + d.slice(1);   // 056... -> 96656...
    if(d.length >= 8) document.getElementById('waFab').href = 'https://wa.me/' + d;
  }catch(_){ /* keep the default number */ }
})();
</script>
</body>
</html>

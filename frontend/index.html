<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Red House Catering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Noto+Naskh+Arabic:wght@500;700&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">
<!-- first frame of the hero shows instantly; the menu page is fetched in the background -->
<link rel="preload" as="image" href="demo/hero-poster.jpg">
<link rel="prefetch" href="menu-page.html">
<style>
  :root{ --gold:#e3b23c; --text:#f4efe6; --line:#2c2925; }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0; background:#000; color:var(--text);}
  body{display:flex; align-items:center; justify-content:center; overflow:hidden; font-family:'Poppins',sans-serif;}
/* floating WhatsApp button over the video */
.wa-fab{
  position:absolute; right:5%; bottom:4%; z-index:3;
  width:calc(var(--fw)*.14); height:calc(var(--fw)*.14); border-radius:50%;
  background:#25D366; color:#fff; display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 14px rgba(0,0,0,.5); text-decoration:none; -webkit-tap-highlight-color:transparent;
}
.wa-fab svg{width:58%; height:58%;}
.wa-fab:active{transform:scale(.94);}
/* music button (added by music.js only when a track is set in Admin -> Music), mirrors the WhatsApp button on the left */
.music-fab{
  position:absolute; left:5%; bottom:4%; z-index:3; padding:0; cursor:pointer;
  width:calc(var(--fw)*.14); height:calc(var(--fw)*.14); border-radius:50%;
  background:rgba(0,0,0,.6); color:var(--gold); border:1px solid rgba(227,178,60,.55);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 14px rgba(0,0,0,.5); -webkit-tap-highlight-color:transparent;
}
.music-fab svg{width:50%; height:50%;}
.music-fab:active{transform:scale(.94);}

/* contact card (opened by the WhatsApp button) - same content as the menu page's contact card */
.contact-wrap{position:absolute; inset:0; z-index:5; display:none;}
.contact-wrap.open{display:block;}
.contact-bg{position:absolute; inset:0; background:rgba(0,0,0,.6);}
.contact-sheet{
  position:absolute; left:0; right:0; bottom:0; background:#121110; border:1px solid var(--line); border-bottom:none;
  border-radius:calc(var(--fw)*.05) calc(var(--fw)*.05) 0 0; box-shadow:0 -8px 30px rgba(0,0,0,.45);
  padding-bottom:env(safe-area-inset-bottom,0px); animation:sheetUp .22s ease-out;
}
@keyframes sheetUp{from{transform:translateY(100%);}to{transform:none;}}
.contact-head{display:flex; align-items:center; justify-content:space-between; direction:ltr; padding:calc(var(--fw)*.035);}
.contact-close{
  width:calc(var(--fw)*.095); height:calc(var(--fw)*.095); border:0; border-radius:50%; flex-shrink:0; cursor:pointer;
  background:rgba(255,255,255,.08); color:var(--text); display:flex; align-items:center; justify-content:center;
}
.contact-close svg{width:50%; height:50%;}
.contact-title{flex:1; text-align:center; font-weight:700; font-size:calc(var(--fw)*.042);}
.contact-spacer{width:calc(var(--fw)*.095); flex-shrink:0;}
.contact-body{padding:calc(var(--fw)*.01) calc(var(--fw)*.045) calc(var(--fw)*.05); display:flex; flex-direction:column; gap:calc(var(--fw)*.03);}
.contact-row{display:flex; align-items:flex-start; gap:calc(var(--fw)*.03); background:#1c1a18; border:1px solid var(--line); border-radius:calc(var(--fw)*.03); padding:calc(var(--fw)*.035);}
.contact-row .ico{width:calc(var(--fw)*.05); height:calc(var(--fw)*.05); flex-shrink:0; margin-top:2px; color:var(--gold);}
.contact-row .wa-ico{color:#25D366;}
.contact-label{margin:0 0 3px; font-size:calc(var(--fw)*.03); color:#a99f8f;}
.contact-value{margin:0; font-size:calc(var(--fw)*.038); font-weight:600; line-height:1.5; overflow-wrap:anywhere;}
.wa-link{display:block; color:var(--gold); font-weight:600; text-decoration:none; padding:2px 0;}
.contact-actions{display:flex; gap:calc(var(--fw)*.025);}
.contact-btn{
  flex:1; text-align:center; text-decoration:none; font-family:inherit; font-weight:700; font-size:calc(var(--fw)*.036);
  border-radius:calc(var(--fw)*.03); padding:calc(var(--fw)*.033) calc(var(--fw)*.02); border:1px solid var(--gold); color:var(--gold); background:transparent;
}
.contact-btn.wa{background:#25D366; color:#fff; border-color:#25D366;}
.contact-btn[hidden]{display:none;}
.contact-sheet[dir="rtl"] .contact-body{font-family:'Noto Naskh Arabic','Poppins',sans-serif;}
.contact-sheet[lang="zh"]{font-family:'Noto Sans SC','Poppins',sans-serif;}
  /* ONE 9:16 page (IG / TikTok). --fw = frame width, everything inside scales from it. */
  .frame{
    --fw:min(100vw, calc(100vh*9/16));
    --fw:min(100vw, calc(100svh*9/16));
    width:var(--fw); aspect-ratio:9/16; position:relative; overflow:hidden; background:#000;
    display:flex; flex-direction:column;
  }

  /* A — logo */
  .sec-a{flex:0 0 13%; min-height:0; overflow:hidden; display:flex; align-items:center; justify-content:center;}
  .sec-a img{width:100%; height:100%; object-fit:contain; display:block;}

  /* B — text (supplied by the client; Arabic + English as in the layout) */
  .sec-b{flex:0 0 7%; min-height:0; overflow:hidden; display:flex; flex-direction:column; justify-content:center; align-items:flex-end; padding:0 6%; line-height:1.15;}
  .sec-b .b-ar{font-family:'Noto Naskh Arabic','Poppins',sans-serif; font-weight:700; color:var(--gold); font-size:calc(var(--fw)*.05);}
  .sec-b .b-en{font-weight:600; color:var(--gold); letter-spacing:.06em; font-size:calc(var(--fw)*.027); text-transform:uppercase;}

  /* C — autoplay video, first frame is the poster */
  .sec-c{position:relative; flex:1 1 auto; min-height:0; background:#000;}
  .sec-c video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 60%; display:block; background:#000;}

  /* D — menu pills: their own black strip BELOW the video (never over it) */
  .sec-d{flex:0 0 10%; min-height:0; display:flex; align-items:center; background:#000;}
  .pills{width:100%; display:flex; gap:2.5%; padding:0 5%;}
  .pill{
    flex:1 1 0; min-width:0; display:flex; align-items:center; justify-content:center; text-decoration:none;
    height:calc(var(--fw)*.115); border-radius:999px; font-weight:700; color:var(--gold);
    background:rgba(0,0,0,.72); border:1px solid rgba(227,178,60,.55);
    font-size:calc(var(--fw)*.05); -webkit-tap-highlight-color:transparent;
    transition:background .15s ease,color .15s ease;
  }
  .pill:first-child{background:var(--gold); color:#1a1408; border-color:var(--gold);}
  .pill:active{background:var(--gold); color:#1a1408;}
  .pill[data-lang="ar"]{font-family:'Noto Naskh Arabic','Poppins',sans-serif; font-size:calc(var(--fw)*.058);}
  .pill[data-lang="zh"]{font-family:'Noto Sans SC','Poppins',sans-serif;}
</style>
</head>
<body>
<main class="frame">

  <!-- A: logo (replace images/page1-logo.png with the high-res file) -->
  <header class="sec-a"><img src="images/rhclogo.png" alt="Red House Catering"></header>

  <!-- B: text -->
  <section class="sec-b" aria-label="Cuisine">
    <span class="b-ar" lang="ar" dir="rtl">المطبخ الصيني</span>
    <span class="b-en">Chinese Cuisine</span>
  </section>

  <!-- C: 4-second autoplay loop. No scrub, no scroll control. -->
  <section class="sec-c">
    <video id="heroVideo" autoplay muted loop playsinline preload="auto" poster="demo/hero-poster.png" aria-hidden="true"></video>
 <a class="wa-fab" id="waFab" href="https://wa.me/966569283982" target="_blank" rel="noopener" aria-label="WhatsApp">
  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
</a>
  </section>

  <!-- D: MENU in 3 languages -> each opens the menu page in that language -->
  <section class="sec-d">
    <nav class="pills" aria-label="Menu">
      <a class="pill" data-lang="en" href="menu-page.html?lang=en" lang="en">MENU</a>
      <a class="pill" data-lang="ar" href="menu-page.html?lang=ar" lang="ar" dir="rtl">المنيو</a>
      <a class="pill" data-lang="zh" href="menu-page.html?lang=zh" lang="zh">菜单</a>
    </nav>
  </section>

  <!-- CONTACT CARD (opened by the WhatsApp button) -->
  <div class="contact-wrap" id="contactWrap">
    <div class="contact-bg" id="contactBg"></div>
    <div class="contact-sheet" id="contactSheet" role="dialog" aria-modal="true" aria-labelledby="contactTitle">
      <div class="contact-head">
        <button class="contact-close" id="contactClose" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
        <span class="contact-title" id="contactTitle">Contact us</span>
        <span class="contact-spacer"></span>
      </div>
      <div class="contact-body">
        <div class="contact-row">
          <svg class="ico wa-ico" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
          <div><p class="contact-label" id="lblWhatsApp">WhatsApp</p><p class="contact-value" id="contactPhone" dir="ltr"></p></div>
        </div>
        <div class="contact-row">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
          <div><p class="contact-label" id="lblLocation">Location</p><p class="contact-value" id="contactAddress"></p></div>
        </div>
        <div class="contact-actions">
          <a class="contact-btn wa" id="contactCallLink" href="#" target="_blank" rel="noopener">Chat on WhatsApp</a>
          <a class="contact-btn" id="contactMapLink" href="#" target="_blank" rel="noopener">Open in Maps</a>
        </div>
      </div>
    </div>
  </div>

</main>

<script>
/* remember the chosen language so the menu page opens in it (also passed as ?lang=) */
document.querySelectorAll('.pill').forEach(function(a){
  a.addEventListener('click', function(){
    try{ localStorage.setItem('redhouse_lang', a.dataset.lang); }catch(_){}
  });
});

/* hero video: poster (= first frame) is already on screen; the video starts as soon as
   its first bytes arrive (faststart mp4), without waiting for the whole file. */
(async function(){
  var v = document.getElementById('heroVideo');
  var DEFAULT_SRC = 'demo/hero.mp4', DEFAULT_POSTER = 'demo/hero-poster.png';
  var src = DEFAULT_SRC;
  try{
    var ctl = new AbortController(), t = setTimeout(function(){ ctl.abort(); }, 1500);
    var r = await fetch('/api/banner', { cache:'no-store', signal:ctl.signal });
    clearTimeout(t);
    if(r.ok){
      var m = await r.json();
      if(m.heroUrl){ src = m.heroUrl; if(m.heroPosterUrl) v.poster = m.heroPosterUrl; }
    }
  }catch(_){ /* API slow or down: use the bundled clip */ }
  v.addEventListener('error', function(){
    if(v.dataset.fb) return;
    v.dataset.fb = '1'; v.poster = DEFAULT_POSTER; v.src = DEFAULT_SRC; v.load();
  });
  v.muted = true;
  v.src = src;
  var go = function(){ var p = v.play(); if(p && p.catch) p.catch(function(){ /* autoplay blocked: poster stays */ }); };
  go();
  ['touchstart','pointerdown'].forEach(function(e){ addEventListener(e, go, { once:true, passive:true }); });
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) go(); });
})();
/* WhatsApp button: opens the contact card (same details as the menu page), numbers come from Admin -> Contact.
   The anchor keeps a real wa.me href as a no-JS fallback; with JS the tap opens the card instead. */
(function(){
  var STR = {
    en:{ title:'Contact us', whatsapp:'WhatsApp', location:'Location', chat:'Chat on WhatsApp', map:'Open in Maps' },
    ar:{ title:'تواصل معنا', whatsapp:'واتساب', location:'الموقع', chat:'تواصل عبر واتساب', map:'افتح في الخرائط' },
    ur:{ title:'ہم سے رابطہ کریں', whatsapp:'واٹس ایپ', location:'مقام', chat:'واٹس ایپ پر بات کریں', map:'نقشے میں کھولیں' },
    zh:{ title:'联系我们', whatsapp:'WhatsApp', location:'位置', chat:'通过 WhatsApp 联系', map:'在地图中打开' }
  };
  /* shown until /api/contact answers (same defaults as routes/contact.js), so the card is never empty */
  var CONTACT = { phone:'056 928 3982', phone2:'00966 56 928 3982', address:'', mapUrl:'https://maps.app.goo.gl/SPNMnoHksw7VcNu66' };
  var WA_COUNTRY = '966';
  var $ = function(id){ return document.getElementById(id); };
  var wrap = $('contactWrap'), sheet = $('contactSheet'), fab = $('waFab'), lastFocus = null;

  function esc(v){ return String(v).replace(/[&<>'"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]; }); }
  function lang(){
    var l = 'en';
    try{ l = localStorage.getItem('redhouse_lang') || ''; }catch(_){}
    if(!STR[l]){ l = (navigator.language || 'en').slice(0,2).toLowerCase(); }
    return STR[l] ? l : 'en';
  }
  /* 00966 56 928 3982 / 056 928 3982 / +966569283982 -> 966569283982 (wa.me format) */
  function waNumber(raw){
    var d = String(raw || '').replace(/\D/g, '');
    if(d.indexOf('00') === 0) d = d.slice(2);
    else if(d.indexOf('0') === 0) d = WA_COUNTRY + d.slice(1);
    return d;
  }
  function render(){
    var l = lang(), t = STR[l];
    sheet.lang = l; sheet.dir = (l === 'ar' || l === 'ur') ? 'rtl' : 'ltr';
    $('contactTitle').textContent = t.title;
    $('lblWhatsApp').textContent = t.whatsapp;
    $('lblLocation').textContent = t.location;
    $('contactCallLink').textContent = t.chat;
    $('contactMapLink').textContent = t.map;

    /* both admin numbers; if they are the same line written two ways, show it once */
    var nums = [], seen = {};
    [CONTACT.phone, CONTACT.phone2].forEach(function(p){
      var wa = waNumber(p);
      if(wa.length >= 8 && !seen[wa]){ seen[wa] = 1; nums.push({ label:String(p).trim(), wa:wa }); }
    });
    $('contactPhone').innerHTML = nums.map(function(n){
      return '<a class="wa-link" dir="ltr" href="https://wa.me/' + n.wa + '" target="_blank" rel="noopener">' + esc(n.label) + '</a>';
    }).join('');
    var chat = $('contactCallLink');
    chat.href = nums.length ? 'https://wa.me/' + nums[0].wa : '#';
    chat.hidden = !nums.length;
    if(nums.length) fab.href = 'https://wa.me/' + nums[0].wa;

    var mapHref = CONTACT.mapUrl || (CONTACT.address ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(CONTACT.address) : '');
    var addrText = CONTACT.address || (mapHref ? t.map : '');
    $('contactAddress').innerHTML = mapHref
      ? '<a class="wa-link" href="' + esc(mapHref) + '" target="_blank" rel="noopener">' + esc(addrText) + '</a>'
      : esc(addrText);
    var mapLink = $('contactMapLink');
    mapLink.href = mapHref || '#';
    mapLink.hidden = !mapHref;
  }
  async function load(){
    try{
      var r = await fetch('/api/contact', { cache:'no-store' });
      if(!r.ok) return;
      var c = await r.json();
      CONTACT = { phone:String(c.phone||''), phone2:String(c.phone2||''), address:String(c.address||''), mapUrl:String(c.mapUrl||'') };
    }catch(_){ /* API slow or down: keep what we have */ }
  }
  async function open(){
    lastFocus = document.activeElement;
    render();                       /* show what we have instantly... */
    wrap.classList.add('open');
    $('contactClose').focus();
    await load();                   /* ...then pick up any admin edit made since page load */
    render();
  }
  function close(){
    wrap.classList.remove('open');
    if(lastFocus && lastFocus.focus) lastFocus.focus();
  }
  fab.addEventListener('click', function(e){ e.preventDefault(); open(); });
  $('contactClose').addEventListener('click', close);
  $('contactBg').addEventListener('click', close);
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && wrap.classList.contains('open')) close(); });

  render();
  load().then(render);              /* warm the details so the card is current even offline-ish */
})();
</script>
<!-- background music: track + on/off are set in Admin -> Music -->
<script src="music.js" data-page="index" data-host=".sec-c" data-class="music-fab" defer></script>
</body>
</html>

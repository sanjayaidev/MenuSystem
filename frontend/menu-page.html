<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Red House Catering — Menu</title>
<script>document.documentElement.setAttribute('data-theme','dark');</script>
<!-- LIGHT/DARK TOGGLE DISABLED (dark only). Original theme script:
<script>
(function(){
  try{
    var saved = localStorage.getItem('redhouse_theme');
    var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', theme);
  }catch(e){ document.documentElement.setAttribute('data-theme', 'dark'); }
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Cinzel:wght@500;600&family=Cormorant+Garamond:wght@600;700&family=Noto+Naskh+Arabic:wght@500;700&family=Noto+Nastaliq+Urdu:wght@500;700&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand-h:clamp(84px,29vw,136px);
    --bg:#121110; --surface:#1c1a18; --line:#2c2925;
    --gold:#e3b23c; --red:#b8352b;
    --text:#f4efe6; --muted:#a99f8f;
  }
  /* LIGHT MODE DISABLED (dark only) — kept for reference:
   Light theme — brand gold/red stay constant, surfaces flip 
  html[data-theme="light"]{
    --bg:#faf6ef; --surface:#ffffff; --line:#e6ddcf;
    --text:#241f1a; --muted:#756b5c;
  }
  html[data-theme="light"] .icon-btn{background:rgba(0,0,0,.06);}
  html[data-theme="light"] .qty-stepper .step-minus{background:rgba(0,0,0,.08);}
  html[data-theme="light"] .empty-cart .empty-icon{background:rgba(0,0,0,.05);}
  */
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Poppins',sans-serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    transition:background .2s ease, color .2s ease;
  }
  html[lang="ar"] body{font-family:'Noto Naskh Arabic','Poppins',sans-serif;}
  html[lang="ur"] body{font-family:'Noto Nastaliq Urdu','Poppins',sans-serif;}
  html[lang="zh"] body{font-family:'Noto Sans SC','Poppins',sans-serif;}
  .app{max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative; padding-bottom:calc(58px + env(safe-area-inset-bottom,0px));}

  /* ===== BRAND ===== */
  .topbar{
    position:sticky; top:0; z-index:20; background:#000; min-height:var(--brand-h);
    display:flex; align-items:center; justify-content:center; padding:0;
  }
  .topbar .logo-wrap{width:100%; display:flex; align-items:center; justify-content:center;}
  .topbar .logo-wrap img{width:100%; height:auto; max-height:var(--brand-h); object-fit:contain; display:block;}
  .topbar .logo-fallback{color:var(--gold); font-weight:700; font-size:14px; display:none;}
  .language-row{display:flex; align-items:center; justify-content:center; gap:10px; padding:12px 14px; background:#000;}
  .lang-pills{
    display:flex; justify-content:center; gap:6px; overflow-x:auto; scrollbar-width:none; -ms-overflow-style:none;
    max-width:100%;
  }
  .lang-pills::-webkit-scrollbar{display:none;}
  .lang-pill{
    flex-shrink:0; background:#000; color:var(--muted); border:1px solid var(--line);
    border-radius:999px; padding:6px 14px; font-family:inherit; font-size:12px; font-weight:600;
    cursor:pointer; transition:background .15s ease, color .15s ease;
  }
  .lang-pill.active{background:var(--gold); color:#1a1408; border-color:var(--gold);}
  .theme-toggle{
    width:34px; height:34px; flex-shrink:0; border-radius:50%; border:1px solid #2c2925;
    background:#000; color:var(--gold); display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .theme-toggle svg{width:17px; height:17px;}
  .theme-toggle .icon-moon{display:none;}
  html[data-theme="light"] .theme-toggle .icon-sun{display:none;}
  html[data-theme="light"] .theme-toggle .icon-moon{display:block;}

  /* ===== HERO: pinned, autoplaying video that can be scrubbed ===== */
  .hero{position:relative; height:100svh; min-height:420px; overflow:clip; background:#000;}
  .hero-stage{position:sticky; top:var(--brand-h); height:calc(100svh - var(--brand-h)); min-height:320px; overflow:hidden; background:#000; touch-action:pan-y; user-select:none; -webkit-user-select:none;}
  .hero-video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block;}
  .hero-scrim{
    position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(to top, rgba(8,12,10,.75) 0%, rgba(8,12,10,0) 45%);
  }
  .hero-cue{
    position:absolute; left:20px; bottom:22px; display:flex; align-items:center; gap:8px;
    font-size:12px; color:var(--muted); text-decoration:none;
  }
  .hero-cue svg{width:14px; height:14px; animation:bob 1.6s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(4px);}}
  html[dir="rtl"] .hero-meter, html[dir="rtl"] .hero-cue{left:auto; right:20px;}
  @media (prefers-reduced-motion:reduce){ .hero-cue svg{animation:none;} }

  /* ===== SPECIAL CATEGORY VIDEOS ===== */
  .section{padding:22px 16px 10px;}
  .sec-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:10px;}
  .sec-head h2{margin:0; font-size:22px;}
  .special-controls{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px;}
  .special-hint{margin:0; color:var(--muted); font-size:11px;}
  .speed-control{display:flex; align-items:center; gap:8px; white-space:nowrap; color:var(--muted); font-size:11px;}
  .speed-control input{width:94px; accent-color:var(--gold); touch-action:pan-x;}
  .speed-control output{min-width:1.2em; text-align:center; color:var(--text); font-weight:700;}
  .special-row{display:grid; grid-template-columns:1fr; gap:20px;}
  .special-card{min-width:0; cursor:pointer;}
  .special-video{position:relative; aspect-ratio:16/9; overflow:hidden; background:#000; touch-action:pan-y; user-select:none; -webkit-user-select:none; cursor:grab;}
  .special-video.dragging{cursor:grabbing;}
  .special-video video{position:relative; width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; -webkit-user-drag:none;}
  /* first frame of the clip, painted behind the <video>; shows whenever the video is unloaded */
  .special-cover{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; pointer-events:none;}
  .special-scrub{position:absolute; inset:auto 0 0; height:3px; background:rgba(244,239,230,.25);}
  .special-scrub i{display:block; width:100%; height:100%; background:var(--gold); transform:scaleX(0); transform-origin:left;}
  .special-card .hint{position:absolute; left:50%; bottom:14px; transform:translateX(-50%); display:flex; align-items:center; gap:8px; padding:5px 12px; border-radius:999px; color:#f4efe6; background:rgba(0,0,0,.58); font-size:11px; pointer-events:none; transition:opacity .3s;}
  .special-card .hint i{font-style:normal; color:var(--gold); font-size:18px; line-height:1;}
  .special-card .category-name{margin:8px 2px 0; font-size:15px; font-weight:600;}
  .special-card .category-action{margin:2px 2px 0; color:var(--muted); font-size:12px;}
  .special-add{position:absolute; right:10px; bottom:11px; z-index:2; display:flex; align-items:center; gap:8px; margin:0; border:0; background:var(--gold); color:#1a1408; padding:8px 12px; font:600 12px 'Poppins',sans-serif; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.3);}
  .special-foods{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:4px 14px; margin:8px 2px 0; padding-inline-start:20px; color:var(--muted); font-size:11px; line-height:1.4;}
  .special-foods li{min-width:0; overflow-wrap:anywhere;}
  .special-foods li.is-current{color:var(--gold); font-weight:700;}
  #special[hidden]{display:none;}
  .special-row.hints-off .hint{opacity:0;}
  .special-video.dragging + .hint{opacity:0;}

  /* ===== MENU ===== */
  #menu{display:flex; flex-direction:column; scroll-margin-top:var(--brand-h);}
  #menuTitle{margin:8px 16px 0; font-size:22px;}
  .controls{display:flex; flex-direction:column; gap:10px; padding:14px 0 8px; order:1;}
  .controls select{
    flex:none; width:calc(100% - 32px); margin:0 16px; background:var(--surface); color:var(--text); border:1px solid var(--line);
    border-radius:10px; padding:10px 10px; font-family:inherit; font-size:13px; appearance:none;
  }
  /* category boxes: one horizontally scrolling row (replaces the old category dropdown) */
  .cat-row{
    display:flex; gap:8px; overflow-x:auto; padding:2px 16px 4px; scroll-snap-type:x proximity;
    scrollbar-width:none; -ms-overflow-style:none; -webkit-overflow-scrolling:touch; overscroll-behavior-x:contain;
  }
  .cat-row::-webkit-scrollbar{display:none;}
  .cat-chip{
    flex:0 0 auto; scroll-snap-align:start; white-space:nowrap; cursor:pointer;
    background:var(--surface); color:var(--text); border:1px solid var(--line); border-radius:10px;
    padding:10px 14px; font-family:inherit; font-size:13px; font-weight:600; -webkit-tap-highlight-color:transparent;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .cat-chip.active{background:var(--gold); color:#1a1408; border-color:var(--gold);}
  .cat-chip:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
  .offer-banner{order:2; display:grid; grid-template-columns:minmax(0,1fr); gap:0; margin:8px 16px 10px; padding:0; overflow:hidden; background:var(--gold); color:#1a1408;}
  .offer-banner-copy{grid-row:2; min-width:0; padding:14px 16px;}
  .offer-banner h3{margin:0 0 4px; font-size:14px; line-height:1.25;}
  .offer-banner p{margin:0; font-size:11px; line-height:1.4;}
  .offer-banner img{grid-row:1; display:block; width:100%; aspect-ratio:1/1; height:auto; max-width:none; object-fit:cover;}
  main{flex:1; padding:6px 16px 20px; order:3;}
  .app.menu-mode .hero,.app.menu-mode #special{display:none;}
  .app.menu-mode #menuTitle{display:none;}
  .app.menu-mode .offer-banner{order:1; margin-top:12px;}
  .app.menu-mode .controls{order:2; padding-top:6px;}

    /* ===== MENU CARD: three layers inside one 2.5:1 box =====
     1  .bg    background picture (admin: "Card background image"), fills the box
      2  .card  parchment card covering the right two thirds: name, price, Add to cart
     3  .food  transparent food PNG (admin: "Food PNG"), right-aligned and drawn over the background AND the card
     Tune the look with --card-w and --food-overlap. Both are a share of the box width. */
  .row{
    --u:calc(min(100vw - 32px, 448px) / 100);   /* 1% of the card width (app is 480px wide with 16px side padding) */
    --card-w:66.6667%;     /* layer 2: how much of the box the card covers */
    --food-overlap:20%;    /* layer 3: how far the food PNG reaches over the card */
    --paper:#f6f1e6; --paper-edge:#e9e0cd; --ornament:#b8975a; --ink:#2b2622;
    position:relative; display:block; width:100%; aspect-ratio:2.5 / 1; margin:0 0 14px; overflow:hidden;
    background:radial-gradient(120% 120% at 25% 30%, #3a2d24 0%, #2a211b 60%, #1d1612 100%);  /* shown until/unless a background image is set: same colour on every card */
    color:var(--ink);
  }

  /* layer 1 */
  .row .bg{position:absolute; inset:0; z-index:0; width:100%; height:100%; object-fit:cover; display:block;}

  /* layer 2 */
  .row .card{
    position:absolute; inset-block:0; inset-inline-end:0; z-index:1; width:var(--card-w);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:calc(2.4 * var(--u)); text-align:center;
    padding:calc(4 * var(--u)) calc(3 * var(--u)) calc(11 * var(--u));
    padding-inline-start:calc(var(--food-overlap) + 1.5 * var(--u));   /* keep the text clear of the food PNG */
    background:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .25  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
      radial-gradient(120% 90% at 50% 40%, #fbf8f0 0%, var(--paper) 55%, var(--paper-edge) 100%);
    box-shadow:calc(-1.2 * var(--u)) 0 calc(3 * var(--u)) rgba(0,0,0,.35);
  }
  html[dir="rtl"] .row .card{box-shadow:calc(1.2 * var(--u)) 0 calc(3 * var(--u)) rgba(0,0,0,.35);}
  .row .card::before{content:""; position:absolute; inset:calc(1.6 * var(--u)); border:1px solid rgba(184,151,90,.55); pointer-events:none;}
  .row .corner{position:absolute; width:calc(4.6 * var(--u)); height:calc(4.6 * var(--u)); color:var(--ornament); pointer-events:none;}
  .row .corner.tl{top:calc(1.1 * var(--u)); left:calc(1.1 * var(--u));}
  .row .corner.tr{top:calc(1.1 * var(--u)); right:calc(1.1 * var(--u)); transform:scaleX(-1);}
  .row .corner.bl{bottom:calc(1.1 * var(--u)); left:calc(1.1 * var(--u)); transform:scaleY(-1);}
  .row .corner.br{bottom:calc(1.1 * var(--u)); right:calc(1.1 * var(--u)); transform:scale(-1,-1);}
  .row .flourish{width:calc(11 * var(--u)); height:auto; color:var(--ornament);}
  .row .name{
    margin:0; font-family:'Cinzel','Cormorant Garamond',Georgia,'Times New Roman',serif; font-weight:600;
    letter-spacing:.06em; text-transform:uppercase; font-size:max(12px, calc(3.2 * var(--u))); line-height:1.2;
    color:var(--ink); overflow-wrap:anywhere;
  }
  .row .price{
    margin:0; font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif; font-weight:700;
    font-size:max(16px, calc(4.6 * var(--u))); line-height:1; letter-spacing:.02em; color:#5b4a2c;
  }
  /* scripts where uppercase / letter-spacing / Cinzel would break the text */
  html[lang="ar"] .row .name{font-family:'Noto Naskh Arabic',serif; letter-spacing:0; text-transform:none; line-height:1.5;}
  html[lang="ur"] .row .name{font-family:'Noto Nastaliq Urdu',serif; letter-spacing:0; text-transform:none; line-height:1.9;}
  html[lang="zh"] .row .name{font-family:'Noto Sans SC',sans-serif; letter-spacing:.04em; text-transform:none;}

  /* layer 3: the box is card-edge + overlap wide, the PNG sits against its card-side edge, taps pass through to .open */
  .row .food{
    position:absolute; z-index:2; pointer-events:none;
    inset-block:5%; inset-inline-start:0; width:calc(100% - var(--card-w) + var(--food-overlap));
    display:flex; align-items:center; justify-content:flex-end;
  }
  .row .food img{
    display:block; height:100%; width:auto; max-width:100%; object-fit:contain; object-position:right center;
    filter:drop-shadow(0 calc(1 * var(--u)) calc(1.4 * var(--u)) rgba(0,0,0,.45));
  }
  html[dir="rtl"] .row .food img{object-position:left center;}
  .row .thumb-fallback{display:none; width:60%; height:60%; align-items:center; justify-content:center;}
  .row .thumb-fallback svg{width:55%; height:55%;}

  /* whole card opens the item; the button sits on top of the layers */
  .row .open{
    position:absolute; inset:0; z-index:3; width:100%; height:100%; margin:0; padding:0; border:0;
    background:transparent; cursor:pointer; -webkit-tap-highlight-color:rgba(227,178,60,.18);
  }
  .row .open:active{background:rgba(227,178,60,.08);}
  .row .open:focus-visible{outline:2px solid var(--gold); outline-offset:-3px;}

  .row .add{
    position:absolute; inset-inline-end:calc(2.4 * var(--u)); bottom:calc(2.4 * var(--u)); z-index:4;
    display:flex; align-items:center; gap:calc(1.4 * var(--u)); border:0; cursor:pointer;
    background:var(--gold); color:#1a1408;
    padding:max(9px, calc(1.3 * var(--u))) max(10px, calc(2.2 * var(--u)));
    font-family:inherit; font-weight:600; font-size:max(11px, calc(1.9 * var(--u))); line-height:1;
    box-shadow:0 calc(.3 * var(--u)) calc(1 * var(--u)) rgba(0,0,0,.3);
    transition:filter .15s, transform .1s;
  }
  .row .add:hover{filter:brightness(1.07);}
  .row .add:active{transform:translateY(1px);}
  .row .add b{font-weight:700;}

  @media (max-width:420px){
    .row .card{gap:calc(2 * var(--u)); padding-bottom:calc(12 * var(--u));}
  }
  /* small phones: the price is already shown above the button, so keep the button short enough to clear the food PNG */
  html[lang="ur"] .row .add b{display:none;}   /* the Urdu label is long: same treatment at every width */
  @media (max-width:400px){
    .row .add b{display:none;}
    .row .add{padding:max(9px, calc(1.3 * var(--u))) max(9px, calc(2 * var(--u)));}
  }

  .empty{padding:40px 10px; text-align:center; color:var(--muted); font-size:14px;}

  /* ===== OVERLAYS (item modal / cart / checkout) ===== */
  .overlay{
    position:absolute; inset:0; z-index:30; background:var(--bg); display:none;
    flex-direction:column; min-height:0; overflow-y:auto;
  }
  .overlay.is-open{display:flex;}
  #cartOverlay, #profileOverlay{
    position:fixed; inset: auto auto calc(58px + env(safe-area-inset-bottom,0px)) 50%;
    width:min(480px, 100%); max-height:calc(100svh - 58px - env(safe-area-inset-bottom,0px));
    transform:translateX(-50%); border:1px solid var(--line); border-bottom:none;
    border-radius:18px 18px 0 0; box-shadow:0 -8px 30px rgba(0,0,0,.35); overflow:hidden;
  }
  #itemModal{
    position:fixed; inset:0 auto 0 50%; width:min(480px, 100%); height:100svh; max-height:100svh;
    transform:translateX(-50%); overflow:hidden;
  }
  /* Checkout: pin to the viewport like the other overlays. Without this it fell back to
     .overlay {position:absolute; inset:0}, i.e. stretched over the whole (very tall) page
     and opened wherever the page happened to be scrolled -> blank area / endless scroll. */
  #checkoutOverlay{
    position:fixed; inset:0 auto 0 50%; width:min(480px, 100%); height:100svh; max-height:100svh;
    transform:translateX(-50%); overflow-y:auto; overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
  }
  .overlay-head{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:14px 14px; position:sticky; top:0; background:var(--bg); z-index:2;
  }
  html[dir="rtl"] .overlay-head{flex-direction:row-reverse;}
  .icon-btn{
    width:38px; height:38px; border-radius:50%; border:none; background:rgba(255,255,255,.06);
    color:var(--text); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .icon-btn svg{width:18px; height:18px;}
  .overlay-title{font-size:16px; font-weight:700; flex:1; text-align:center;}
  .count-pill{
    background:var(--red); color:#fff; font-size:12px; font-weight:700; border-radius:999px;
    padding:4px 12px; flex-shrink:0;
  }

  /* item modal */
  .item-hero{position:relative; width:100%; aspect-ratio:1/1; max-height:340px; flex:0 0 auto; overflow:hidden; background:#000;}
  .item-hero img{width:100%; height:100%; object-fit:cover;}
  .item-hero .icon-btn{position:absolute; top:12px; inset-inline-start:12px;}
  .item-tag{
    position:absolute; top:12px; inset-inline-end:12px; background:var(--gold); color:#1a1408;
    font-size:12px; font-weight:700; border-radius:999px; padding:5px 12px;
  }
  .item-body{padding:16px; flex:1 1 auto; min-height:0; overflow-y:auto;}
  .badge-row{display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap;}
  .badge{
    border:1px solid var(--line); border-radius:8px; padding:5px 10px; font-size:12px;
    color:var(--gold); font-weight:600; background:var(--surface);
  }
  .item-body h2{font-size:21px; margin:4px 0 2px;}
  .item-subtitle{color:var(--gold); font-size:13px; font-weight:600; margin:0 0 12px;}
  .item-desc{color:var(--muted); font-size:14px; line-height:1.6; margin:0 0 16px;}
  .includes-box{
    border:1px solid var(--gold); background:rgba(227,178,60,.08); border-radius:12px;
    padding:12px 14px; margin-bottom:16px;
  }
  .includes-box .includes-title{color:var(--gold); font-weight:700; font-size:13px; margin:0 0 6px;}
  .includes-box p{margin:0; font-size:13px; color:var(--text); line-height:1.5;}
  .item-actionbar{
    display:flex; align-items:center; gap:10px; padding:12px 16px 16px; position:sticky; bottom:0; flex-shrink:0;
    background:var(--bg); border-top:1px solid var(--line);
  }
  .add-cart-btn{
    flex:1; background:var(--gold); color:#1a1408; border:none; border-radius:12px;
    padding:14px 16px; font-family:inherit; font-size:15px; font-weight:700; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .qty-stepper{
    display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line);
    border-radius:12px; padding:10px 12px; flex-shrink:0;
  }
  .qty-stepper button{
    width:26px; height:26px; border-radius:50%; border:none; font-size:16px; font-weight:700;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .qty-stepper .step-minus{background:rgba(255,255,255,.08); color:var(--text);}
  .qty-stepper .step-plus{background:var(--red); color:#fff;}
  .qty-stepper .qty-val{min-width:16px; text-align:center; font-weight:700;}

  /* cart / order type toggle */
  .order-type{display:flex; gap:10px; padding:0 16px 14px;}
  .order-type button{
    flex:1; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--text);
    font-family:inherit; font-size:13px; font-weight:600; padding:12px 8px; cursor:pointer;
  }
  .order-type button.active{background:var(--gold); color:#1a1408; border-color:var(--gold);}
  .order-type button .free-tag{color:#5fbf7a; font-weight:700; margin-inline-end:4px;}
  .order-type button.active .free-tag{color:#1a1408;}

  .cart-list{padding:0 16px; flex:0 1 auto; min-height:0; max-height:42svh; overflow-y:auto;}
  .cart-row{
    display:flex; align-items:center; gap:12px; padding:14px 0; border-bottom:1px solid var(--line);
  }
  .cart-row .trash-btn{background:none; border:none; color:var(--muted); cursor:pointer; flex-shrink:0;}
  .cart-row .trash-btn svg{width:18px; height:18px;}
  .cart-row .cart-info{flex:1; min-width:0;}
  .cart-row .cart-info .name{font-weight:600; font-size:14px; margin:0 0 8px;}
  .cart-row .cart-thumb{width:56px; height:56px; border-radius:10px; overflow:hidden; flex-shrink:0; background:#000;}
  .cart-row .cart-thumb img{width:100%; height:100%; object-fit:cover;}
  .cart-row .price{color:var(--gold); font-weight:700; font-size:14px; white-space:nowrap;}

  .cart-summary{padding:14px 16px; border-top:1px solid var(--line); position:sticky; bottom:0; flex-shrink:0; background:var(--bg);}
  .summary-line{display:flex; justify-content:space-between; font-size:13px; color:var(--muted); padding:3px 0;}
  .summary-line.final{color:var(--gold); font-weight:700; font-size:16px; padding-top:8px;}
  .primary-btn{
    width:100%; margin-top:12px; background:var(--gold); color:#1a1408; border:none; border-radius:12px;
    padding:15px; font-family:inherit; font-size:15px; font-weight:700; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .wa-btn{background:#25d366; color:#06210f;}
  .empty-cart{flex:0 0 auto; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:28px 24px; text-align:center;}
  .empty-cart .empty-icon{
    width:90px; height:90px; border-radius:50%; background:rgba(255,255,255,.05); display:flex;
    align-items:center; justify-content:center; margin-bottom:20px; color:var(--gold);
  }
  .empty-cart .empty-icon svg{width:38px; height:38px;}
  .empty-cart h3{font-size:17px; margin:0 0 8px;}
  .empty-cart p{color:var(--muted); font-size:13px; margin:0 0 22px; line-height:1.5;}

  /* checkout form */
  .checkout-body{padding:16px; flex:1;}
  .profile-body{padding:16px; overflow-y:auto; max-height:calc(100svh - 130px);}
  .profile-subtitle{color:var(--muted); font-size:13px; line-height:1.5; margin:0 0 18px;}
  .profile-identity{border:1px solid var(--line); border-radius:10px; background:var(--surface); padding:12px; margin-bottom:16px;}
  .profile-identity strong{display:block; margin-bottom:4px;}
  .profile-identity small{display:block; color:var(--muted); overflow-wrap:anywhere;}
  .profile-actions{display:flex; gap:10px; margin-top:16px;}
  .profile-actions .primary-btn{margin-top:0;}
  .profile-secondary-btn{flex:1; border:1px solid var(--line); border-radius:12px; padding:14px; background:var(--surface); color:var(--text); font:inherit; font-weight:700; cursor:pointer;}
  .profile-status{min-height:18px; color:var(--muted); font-size:12px; margin:12px 0 0;}
  .profile-orders-title{font-size:16px; margin:26px 0 10px;}
  .profile-order{border:1px solid var(--line); border-radius:10px; background:var(--surface); padding:12px; margin-bottom:8px;}
  .profile-order-head{display:flex; justify-content:space-between; gap:10px; font-size:13px; font-weight:700;}
  .profile-order small{display:block; color:var(--muted); margin-top:6px; line-height:1.45;}
  .profile-empty{color:var(--muted); font-size:13px;}
  .checkout-branch{color:var(--gold); font-weight:700; font-size:14px; margin-bottom:2px;}
  .checkout-subrow{display:flex; justify-content:space-between; color:var(--muted); font-size:12px; margin-bottom:18px;}
  .field-label{font-size:12px; color:var(--gold); font-weight:600; margin:14px 0 6px;}
  .field-input, .field-textarea{
    width:100%; background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:12px 12px; color:var(--text); font-family:inherit; font-size:14px;
  }
  .field-textarea{resize:vertical; min-height:64px;}
  .pay-method{
    display:flex; align-items:center; justify-content:center; gap:8px; border:1px solid var(--gold);
    border-radius:12px; padding:14px; margin-top:18px; color:var(--gold); font-weight:700; font-size:14px;
    background:rgba(227,178,60,.08);
  }
  .status-note{font-size:12px; text-align:center; color:var(--muted); margin-top:8px;}
  .primary-btn:disabled{opacity:.6; cursor:default;}

  /* ===== FLOATING chat/call ===== */
  .floating{position:fixed; right:14px; bottom:82px; display:flex; flex-direction:column; gap:10px; z-index:15;}
  html[dir="rtl"] .floating{right:auto; left:14px;}
  .fab{width:46px; height:46px; border-radius:50%; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 14px rgba(0,0,0,.4);}
  .fab svg{width:20px; height:20px;}
  .fab-call{background:var(--gold); color:#1a1408;}

  /* ===== CONTACT CARD (opened by the call button) ===== */
  #contactOverlay{
    position:fixed; inset: auto auto calc(58px + env(safe-area-inset-bottom,0px)) 50%;
    width:min(480px, 100%); transform:translateX(-50%); border:1px solid var(--line); border-bottom:none;
    border-radius:18px 18px 0 0; box-shadow:0 -8px 30px rgba(0,0,0,.35); overflow:hidden;
  }
  .contact-body{padding:4px 18px 22px; display:flex; flex-direction:column; gap:12px;}
  .contact-row{
    display:flex; align-items:flex-start; gap:12px; background:var(--surface);
    border:1px solid var(--line); border-radius:12px; padding:14px;
  }
  .contact-row .ico{width:20px; height:20px; color:var(--gold); flex-shrink:0; margin-top:2px;}
  .contact-label{font-size:12px; color:var(--muted); margin:0 0 3px;}
  .contact-value{font-size:15px; font-weight:600; margin:0; line-height:1.5; overflow-wrap:anywhere;}
  .contact-actions{display:flex; gap:10px;}
  .contact-btn{
    flex:1; text-align:center; text-decoration:none; font-family:inherit; font-size:14px; font-weight:700;
    border-radius:12px; padding:13px 10px; border:1px solid var(--gold); color:var(--gold); background:transparent;
  }
  .contact-btn.primary{background:var(--gold); color:#1a1408;}

  /* ===== FOOTER: Home, Menu, Basket, Profile ===== */
  footer.tabs{
    position:fixed; left:50%; bottom:0; transform:translateX(-50%); width:min(480px,100%); z-index:10; background:var(--surface); border-top:1px solid var(--line);
    display:flex; padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));
  }
  footer.tabs{transition:transform .25s ease, opacity .25s ease;}
  footer.tabs:not(.show){transform:translate(-50%,110%); opacity:0; pointer-events:none; visibility:hidden;}
  footer.tabs.show{transform:translateX(-50%); opacity:1; visibility:visible;}
  footer.tabs button{flex:1; background:none; border:none; color:var(--muted); font-family:inherit; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:11px; padding:6px 0; cursor:pointer;}
  footer.tabs button.active{color:var(--gold);}
  footer.tabs .icon{width:22px; height:22px;}
  footer.tabs .icon svg{width:100%; height:100%;}
  footer.tabs .icon{position:relative; overflow:visible;}
  /* cart count badge on the Basket tab icon */
  .cart-badge{
    position:absolute; top:-7px; inset-inline-end:-10px; min-width:20px; height:20px; padding:0 4px; box-sizing:border-box;
    border-radius:999px; background:var(--red); color:#fff; font-size:11px; font-weight:700; line-height:16px;
    text-align:center; border:2px solid var(--surface); pointer-events:none;
    transform:scale(1); transition:transform .15s ease;
  }
  .cart-badge[hidden]{display:none;}
  .cart-badge.pop{animation:cartBadgePop .3s ease;}
  @keyframes cartBadgePop{0%{transform:scale(1);}45%{transform:scale(1.35);}100%{transform:scale(1);}}
  @media (prefers-reduced-motion:reduce){.cart-badge.pop{animation:none;}}

  /* ===== MENU PAGE (new flow) ===== */
  /* banner (poster D): fits the width of the page; its height follows the image's own proportions (no fixed size, no cropping). */
  .topbar{min-height:0;}
  .topbar .logo-wrap img{max-height:none;}
  .poster-d{width:100%; background:#000; overflow:hidden;}
  .poster-d img{width:100%; height:auto; display:block;}
  .app.menu-mode .poster-d{display:none;}
  /* WhatsApp */
  .fab-call{background:#25D366; color:#fff;}
  /* music button (added by music.js only when a track is set in Admin -> Music) */
  .fab-music{background:#000; color:var(--gold); border:1px solid rgba(227,178,60,.55);}
  .contact-btn.wa{background:#25D366; color:#fff; border-color:#25D366;}
  .contact-row .wa-ico{color:#25D366;}
  .wa-link{display:block; color:var(--gold); font-weight:600; text-decoration:none; padding:2px 0;}
</style>
</head>

  row.innerHTML = ordered.map(category=>{
    const config = SPECIAL_SECTIONS.find(section=>section.key===category.key);

    const foods = selectedFoods.map(item=>item[`name_${lang}`] || item.name_en);
    const featuredPrice = selectedFoods[0] && Number.isFinite(Number(selectedFoods[0].price))
      ? money(Number(selectedFoods[0].price))
      : '';
    return `<article class="special-card" data-cat="${escapeHtml(category.key)}" data-video-url="${escapeHtml(config?.videoUrl || '')}">
      <div class="special-video"><canvas class="special-cover" aria-hidden="true"></canvas><video muted playsinline preload="none" aria-hidden="true"></video><div class="hint"><i>‹</i><span>${matchMedia('(pointer: coarse)').matches ? 'Swipe' : 'Drag'}</span><i>›</i></div><div class="special-scrub"><i></i></div><button class="special-add" type="button"><span>${escapeHtml(STR[lang].addToCart)}</span><b class="special-add-price">${escapeHtml(featuredPrice)}</b></button></div>
      <p class="category-name">${escapeHtml(label)}</p>
      ${foods.some(Boolean) ? `<ol class="special-foods">${foods.map((food,index)=>`<li data-slot="${index+1}">${escapeHtml(food || '')}</li>`).join('')}</ol>` : ''}

/* ---------- special covers: first frame of each clip, used while the video is unloaded ---------- */
const coverCache = new Map();
const coverKey = card => card.dataset.videoUrl || 'demo/food-360p.mp4';
function setCover(card, video){
  const canvas = card.querySelector('.special-cover');
  const w = video.videoWidth, h = video.videoHeight;
  if(!canvas || !w || !h) return false;
  try{
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(video, 0, 0, w, h);
    const copy = document.createElement('canvas');
    copy.width = w; copy.height = h;
    copy.getContext('2d').drawImage(canvas, 0, 0);
    coverCache.set(coverKey(card), copy);   // survives re-renders (e.g. language change)
    card.dataset.cover = '1';
    return true;
  }catch(_){ return false; }
}
function restoreCover(card){
  const copy = coverCache.get(coverKey(card));
  const canvas = card.querySelector('.special-cover');
  if(!copy || !canvas) return;
  canvas.width = copy.width; canvas.height = copy.height;
  canvas.getContext('2d').drawImage(copy, 0, 0);
  card.dataset.cover = '1';
}

/* ---------- image fallback (dish -> category -> icon) ---------- */
function slugify(s){ return s.toLowerCase().replace(/[^a-z0-9]/g,''); }
function dishImgPath(cat, name){ return `images/${cat}/${slugify(name)}.png`; }
function catImgPath(cat){ return `images/${cat}.png`; }
function genericImgPath(){ return `images/food.png`; }
function hasImageUrl(item){ return typeof item.imagePath === 'string' && item.imagePath.trim().length > 0; }
// A usable http(s) URL, or '' (blocks javascript: / data: values saved in the database).
function safeImgUrl(raw){
  if(typeof raw !== 'string' || !raw.trim()) return '';
  try{
    const url = new URL(raw.trim(), window.location.href);
    if(url.protocol === 'https:' || url.protocol === 'http:') return url.href;
  }catch{}
  return '';
}
function itemImgPath(item){
  if(!hasImageUrl(item)) return dishImgPath(item.cat, item.name.en);
  return safeImgUrl(item.imagePath);
}
const FALLBACK_ICON = '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">' +
  '<circle cx="50" cy="50" r="30" fill="none" stroke="#3a3630" stroke-width="3"/>' +
  '<circle cx="50" cy="50" r="18" fill="none" stroke="#3a3630" stroke-width="2"/></svg>';
function wireImgFallback(imgEl){
  if(imgEl.dataset.hasImageUrl === 'true') return;
  const cat = imgEl.dataset.cat;
  function onError(){
    if(imgEl.dataset.stage === 'dish'){ imgEl.dataset.stage = 'cat'; imgEl.src = catImgPath(cat); }
    else if(imgEl.dataset.stage === 'cat'){ imgEl.dataset.stage = 'generic'; imgEl.src = genericImgPath(); }
    else {
      imgEl.removeEventListener('error', onError);
      imgEl.style.display = 'none';
      const fb = imgEl.nextElementSibling;
      if(fb) fb.style.display = 'flex';
    }
  }
  imgEl.dataset.stage = 'dish';
  imgEl.addEventListener('error', onError);
}
wireImgFallback.call = wireImgFallback; // no-op, keeps linter quiet

(() => {

   'all' = nothing selected: every dish is listed. Tap a box to filter, tap it again to clear.
   POPULAR_KEY is the virtual "Most Popular" box: the POPULAR_COUNT best-selling dishes, whatever their category. */
const POPULAR_KEY = '__popular';
const POPULAR_COUNT = 8;
const POPULAR_SORT_ORDER = 7;   // position of the Most Popular box among the category sort_order values
let currentCat = 'all';

function renderCategoryRow(){
  categoryRow.innerHTML = CATS.map(c=>
    `<button type="button" class="cat-chip${c.key===currentCat ? ' active' : ''}" data-cat="${escapeHtml(c.key)}" aria-pressed="${c.key===currentCat}">${escapeHtml(c.label[lang] || c.label.en || c.key)}</button>`
  ).join('');
}
function setCat(key, { scroll = true, toggle = true } = {}){
  currentCat = (!key || (toggle && key === currentCat)) ? 'all' : key;
  categoryRow.querySelectorAll('.cat-chip').forEach(chip=>{
    const on = chip.dataset.cat === currentCat;
    chip.classList.toggle('active', on);
    chip.setAttribute('aria-pressed', String(on));
    if(on && scroll) chip.scrollIntoView({ block:'nearest', inline:'center', behavior:'smooth' });
  });
  render();
}
categoryRow.addEventListener('click', e=>{
  const chip = e.target.closest('.cat-chip');
  if(chip) setCat(chip.dataset.cat);
});

function render(){
  const cat = currentCat;
  const sort = sortSelect.value;
  let items;
  if(cat === POPULAR_KEY) items = ITEMS.slice().sort((a,b)=>b.pop-a.pop).slice(0, POPULAR_COUNT);
  else items = ITEMS.filter(i => cat==='all' || i.cat===cat);

  if(sort==='name') items.sort((a,b)=>a.name[lang].localeCompare(b.name[lang]));
  else if(sort==='time') items.sort((a,b)=>b.id-a.id);
  else if(sort==='offer') items.sort((a,b)=>(b.offer-a.offer) || (b.pop-a.pop));
  else if(sort==='price') items.sort((a,b)=>a.price - b.price);
  else if(sort==='popular') items.sort((a,b)=>b.pop-a.pop);

  if(!items.length){
    listEl.innerHTML = `<div class="empty">${STR[lang].empty}</div>`;
    return;
  }

  // Three layers per card: 1 background, 2 card (name, price, Add to cart), 3 food PNG over both.
  // No food PNG? the item's normal image is used, so existing items keep working.
  listEl.innerHTML = items.map(i=>{
    const name = i.name[lang];
    const price = money(i.price);
    const bgUrl = safeImgUrl(i.bgImage);
    const pngUrl = safeImgUrl(i.foodPng);
    const foodUrl = pngUrl || itemImgPath(i);
    const hasUrl = Boolean(pngUrl) || hasImageUrl(i);
    const corner = pos => `<svg class="corner ${pos}" viewBox="0 0 48 48" aria-hidden="true"><use href="#rh-corner"/></svg>`;
    return `<article class="row" data-id="${i.id}">
      ${bgUrl ? `<img class="bg" src="${escapeHtml(bgUrl)}" alt="" loading="lazy" decoding="async">` : ''}
      <div class="card">
        ${corner('tl')}${corner('tr')}${corner('bl')}${corner('br')}
        <svg class="flourish" viewBox="0 0 120 24" aria-hidden="true"><use href="#rh-flourish"/></svg>
        <h3 class="name">${escapeHtml(name)}</h3>
        <p class="price">${escapeHtml(price)}</p>
      </div>
      <div class="food">
        ${foodUrl ? `<img src="${escapeHtml(foodUrl)}" alt="" loading="lazy" decoding="async" data-cat="${escapeHtml(i.cat || '')}" data-has-image-url="${hasUrl}">` : ''}
        ${!hasUrl ? `<div class="thumb-fallback">${FALLBACK_ICON}</div>` : ''}
      </div>
      <button class="open" type="button" aria-label="${escapeHtml(name)}"></button>
      <button class="add" type="button"><span>${escapeHtml(STR[lang].addToCart)}</span><b>${escapeHtml(price)}</b></button>
    </article>`;
  }).join('');

  listEl.querySelectorAll('.food img').forEach(wireImgFallback);
  // an uploaded image that fails to load just disappears (the card's base colour / the other layers still show)
  listEl.querySelectorAll('.bg').forEach(img=>img.addEventListener('error', ()=> img.remove(), { once:true }));
  listEl.querySelectorAll('.food img[data-has-image-url="true"]').forEach(img=>img.addEventListener('error', ()=>{ img.style.display = 'none'; }, { once:true }));
}

// 00966 56 928 3982 / 056 928 3982 / +966569283982  ->  966569283982 (wa.me format)
function waNumber(raw){
  let d = String(raw || '').replace(/\D/g, '');
  if(d.startsWith('00')) d = d.slice(2);
  else if(d.startsWith('0')) d = WA_COUNTRY + d.slice(1);
  return d;
}

  document.getElementById('contactPhone').innerHTML = nums.length

/* ---------- load categories + menu items from the real backend ---------- */
async function loadMenuData(){
  try{
    const [catsRes, itemsRes] = await Promise.all([
      fetch(`${API_BASE}/api/categories`),
      fetch(`${API_BASE}/api/menu`),
    ]);
    if(!catsRes.ok) throw new Error(`GET /api/categories failed (${catsRes.status})`);
    if(!itemsRes.ok) throw new Error(`GET /api/menu failed (${itemsRes.status})`);

    const cats = await catsRes.json();
    const items = await itemsRes.json();

    CATS = cats.map(c => ({
      key: c.key,
      sort_order: c.sort_order,
      label: { en:c.label_en, ar:c.label_ar, ur:c.label_ur, zh:c.label_zh },
    }));

    // "Most Popular" is not a database category: it is a box that lists the best-selling dishes.
    // It sits 7th, between the six food categories and Dine In / Outside Catering (see db/10_nine_categories.sql).
    CATS.push({
      key: POPULAR_KEY,
      sort_order: POPULAR_SORT_ORDER,
      label: { en:'Most Popular', ar:'الأكثر طلباً', ur:'سب سے مقبول', zh:'最受欢迎' },
    });
    CATS.sort((a,b)=>(a.sort_order - b.sort_order));

    ITEMS = items.map(i => ({
      id: i.id,
      cat: i.categories ? i.categories.key : null,
      pop: i.popularity ?? 0,
      offer: Boolean(i.is_offer),
      cal: i.calories ?? null,
      rating: i.rating != null ? Number(i.rating) : null,
      price: Number(i.price),
      imagePath: i.image_path || '',
      bgImage: i.bg_image_url || '',      // menu card layer 1
      foodPng: i.food_png_url || '',      // menu card layer 3
      name: { en:i.name_en, ar:i.name_ar, ur:i.name_ur, zh:i.name_zh },
      desc: { en:i.description_en || null },
    }));
  }catch(err){
    console.error('Failed to load menu from server:', err);
    CATS = [];
    ITEMS = [];
    listEl.innerHTML = `<div class="empty">Unable to load the menu right now. Please check your connection and try again.</div>`;
  }
}

/* ---------- cart state ----------
   Signed-in users: the cart lives in Supabase (cart_items table via
   /api/cart) so it follows them across devices. Guests: the cart lives
   in localStorage only, on this device/browser. cartSet()/clearCart()
   are the only places that mutate `cart` so every call site stays in
   sync with whichever storage is currently active. */
let cart = {};            // { itemId: qty } — always the in-memory source of truth for rendering
let orderType = 'pickup'; // 'pickup' | 'delivery'
let lastOrder = null;     // {id, items, subtotal, deliveryFee, total} set after a successful order

const GUEST_CART_KEY = 'redhouse_guest_cart';
function loadGuestCart(){
  try{ return JSON.parse(localStorage.getItem(GUEST_CART_KEY) || '{}'); }
  catch(e){ return {}; }
}
function saveGuestCart(){
  try{ localStorage.setItem(GUEST_CART_KEY, JSON.stringify(cart)); }catch(e){ /* storage unavailable, ignore */ }
}

// Sets (or, for qty <= 0, removes) one cart line. Updates the in-memory
// `cart` synchronously so the UI never waits on the network, then syncs
// to Supabase (signed in) or localStorage (guest) in the background.
function cartSet(id, qty){
  id = Number(id);
  if(qty <= 0){ delete cart[id]; } else { cart[id] = qty; }
  updateCartBadge();

  if(authToken){
    const request = qty <= 0
      ? fetch(`${API_BASE}/api/cart/${id}`, { method:'DELETE', headers:authHeaders() })
      : fetch(`${API_BASE}/api/cart`, {
          method:'POST',
          headers:{'Content-Type':'application/json', ...authHeaders()},
          body: JSON.stringify({ menu_item_id:id, quantity:qty }),
        });
    request.catch(err => console.error('Cart sync failed:', err));
  }else{
    saveGuestCart();
  }
}

// Empties the cart (after a completed order): clears every DB row for a
// signed-in user, or just wipes localStorage for a guest.
async function clearCart(){
  const ids = Object.keys(cart).map(Number);
  cart = {};
  updateCartBadge();
  if(authToken){
    try{
      await Promise.all(ids.map(id => fetch(`${API_BASE}/api/cart/${id}`, { method:'DELETE', headers:authHeaders() })));
    }catch(err){ console.error('Failed to clear server cart:', err); }
  }else{
    saveGuestCart();
  }
}

// Replaces in-memory `cart` with whatever's saved server-side for the
// signed-in user (called on page load when a token exists, and after login).
async function loadCartFromServer(){
  try{
    const res = await fetch(`${API_BASE}/api/cart`, { headers: authHeaders() });
    if(!res.ok) throw new Error(`GET /api/cart failed (${res.status})`);
    const { items } = await res.json();
    cart = {};
    items.forEach(row => { if(row.menu_items) cart[row.menu_item_id] = row.quantity; });
    updateCartBadge();
  }catch(err){
    console.error('Failed to load cart from server:', err);
  }
}

// Called once, right after a successful login: folds whatever was in the
// guest's localStorage cart into their DB cart (quantities add on top of
// anything already saved there), then makes the DB the source of truth.
async function mergeGuestCartIntoServer(){
  const guestItems = Object.entries(cart).map(([id, qty]) => ({ menu_item_id:Number(id), quantity:qty }));
  try{
    if(guestItems.length){
      const res = await fetch(`${API_BASE}/api/cart/merge`, {
        method:'POST',
        headers:{'Content-Type':'application/json', ...authHeaders()},
        body: JSON.stringify({ items: guestItems }),
      });
      if(!res.ok) throw new Error(`POST /api/cart/merge failed (${res.status})`);
      const { items } = await res.json();
      cart = {};
      items.forEach(row => { if(row.menu_items) cart[row.menu_item_id] = row.quantity; });
    }else{
      await loadCartFromServer();
    }
  }catch(err){
    console.error('Failed to merge guest cart into server cart:', err);
  }
  try{ localStorage.removeItem(GUEST_CART_KEY); }catch(e){ /* ignore */ }
  updateCartBadge();
}

function itemById(id){ return ITEMS.find(i=>i.id===id); }
function itemPrice(item){ return item.price; }
function cartCount(){ return Object.values(cart).reduce((a,b)=>a+b,0); }

// Red count bubble on the Basket tab. Total quantity across all lines
// (2 burgers + 1 juice = 3). Hidden at 0, capped at 99+, pops on increase.
let lastBadgeCount = 0;
function updateCartBadge(){
  const badge = document.getElementById('cartBadge');
  if(!badge) return;
  const count = cartCount();
  badge.hidden = count <= 0;
  badge.textContent = count > 99 ? '99+' : String(count);
  if(count > lastBadgeCount){
    badge.classList.remove('pop');
    void badge.offsetWidth; // restart the animation
    badge.classList.add('pop');
  }
  lastBadgeCount = count;
}
function cartLines(){
  return Object.entries(cart).map(([id,qty])=>{
    const item = itemById(Number(id));
    return { item, qty, lineTotal: itemPrice(item)*qty };
  }).filter(l=>l.item);
}
function cartSubtotal(){ return cartLines().reduce((sum,l)=>sum+l.lineTotal,0); }
function cartDeliveryFee(){ return orderType==='delivery' ? DELIVERY_FEE : 0; }
function cartTotal(){ return cartSubtotal() + cartDeliveryFee(); }
function money(n){ return `${CURRENCY}${n.toFixed(2)}`; }

function escapeHtml(value){
  return String(value).replace(/[&<>'"]/g, character => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;'
  }[character]));
}
async function readApiJson(response){
  const body = await response.text();
  if(!body.trim()) throw new Error(`Server returned an empty response (HTTP ${response.status}).`);
  try{
    return JSON.parse(body);
  }catch{
    throw new Error(`Server returned an invalid response (HTTP ${response.status}).`);
  }
}
async function loadProfile(){
  if(!authToken){ profileData = null; renderProfile(); return; }
  const response = await fetch(`${API_BASE}/api/auth/me`, { headers: authHeaders() });
  if(!response.ok){
    authToken = ''; profileData = null; localStorage.removeItem(AUTH_TOKEN_KEY); renderProfile();
    return;
  }
  profileData = await readApiJson(response);
  renderProfile();
  loadProfileOrders();
}
async function loadProfileOrders(){
  const ordersEl = document.getElementById('profileOrders');
  ordersEl.innerHTML = '';
  const response = await fetch(`${API_BASE}/api/auth/orders`, { headers: authHeaders() });
  if(!response.ok){ ordersEl.innerHTML = `<p class="profile-empty">${escapeHtml(STR[lang].authError)}</p>`; return; }
  const { orders } = await readApiJson(response);
  if(!orders.length){ ordersEl.innerHTML = `<p class="profile-empty">${escapeHtml(STR[lang].noOrders)}</p>`; return; }
  ordersEl.innerHTML = orders.map(order => {
    const items = order.order_items.map(item => `${item.quantity} × ${escapeHtml(item.name_snapshot)}`).join(', ');
    return `<div class="profile-order"><div class="profile-order-head"><span>${escapeHtml(order.order_number || '#'+order.id)}</span><span>${escapeHtml(money(Number(order.total)))}</span></div><small>${escapeHtml(new Date(order.created_at).toLocaleDateString())} · ${escapeHtml(order.status)}<br>${items}</small></div>`;
  }).join('');
}

/* ---------- SIMULATED PAYMENT + WHATSAPP HANDOFF ---------- */
document.getElementById('checkoutPayBtn').addEventListener('click', async ()=>{
  const name = document.getElementById('checkoutName').value.trim();
  const phone = document.getElementById('checkoutPhone').value.trim();
  const address = document.getElementById('checkoutAddress').value.trim();
  const statusNote = document.getElementById('checkoutStatusNote');
  const payBtn = document.getElementById('checkoutPayBtn');

  if(!name || !phone || (orderType==='delivery' && !address)){
    statusNote.textContent = STR[lang].orderFailed;
    return;
  }

  payBtn.disabled = true;
  checkoutOverlay.dataset.submitting = '1';
  payBtn.textContent = STR[lang].processingPayment;
  statusNote.textContent = '';

  const payload = {
    customer_name: name,
    customer_phone: phone,
    delivery_type: orderType,
    delivery_address: orderType==='delivery' ? address : null,
    items: cartLines().map(l=>({ menu_item_id: l.item.id, quantity: l.qty }))
  };

  try{
    // Simulated payment: brief delay to mimic processing, then create the
    // order server-side (server re-checks prices in Supabase — never trust
    // client-sent prices) and mark it paid.
    await new Promise(r=>setTimeout(r, 700));
    const res = await fetch(`${API_BASE}/api/orders`, {
      method:'POST',
      headers:{'Content-Type':'application/json', ...authHeaders()},
      body: JSON.stringify(payload)
    });
    if(!res.ok) throw new Error('order failed');
    const order = await res.json();
    lastOrder = order;

    statusNote.textContent = STR[lang].paymentDone;
    sendOrderToWhatsApp(order, { name, phone, address });

    await clearCart();
    closeOverlay(checkoutOverlay);
  }catch(err){
    statusNote.textContent = STR[lang].orderFailed;
  }finally{
    payBtn.disabled = false;
    delete checkoutOverlay.dataset.submitting;
    refreshCheckoutStaticText();
  }
});

function sendOrderToWhatsApp(order, contact){
  const lines = cartLines().map(l=>`• ${l.qty}x ${l.item.name.en} — ${money(l.lineTotal)}`).join('\n');
  const typeLine = orderType==='delivery'
    ? `Home delivery\nAddress: ${contact.address}`
    : `Pick-up from the branch`;
  const message =
`New order ${order.order_number || '#'+order.id} — ${BRANCH_NAME}
${typeLine}

Name: ${contact.name}
Phone: ${contact.phone}

Items:
${lines}

Subtotal: ${money(cartSubtotal())}
Delivery: ${money(cartDeliveryFee())}
Total: ${money(cartTotal())}
Payment: confirmed (simulated)`;

  const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
  window.open(url, '_blank');
}

  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clamp = (value,min,max)=>Math.min(max,Math.max(min,value));
  const smooth = value=>value*value*(3-2*value);
  let speed = 4;
  try { const saved = Number(localStorage.getItem('scrubSpeedUI')); if(saved >= 1 && saved <= 10) speed = saved; } catch(_){}
  speedInput.value = speed;
  speedValue.textContent = speed;
  speedInput.addEventListener('input',()=>{
    speed = Number(speedInput.value) || 4;
    speedValue.textContent = speed;
    try { localStorage.setItem('scrubSpeedUI', String(speed)); } catch(_){}
  });
  const dragGain = ()=>speed*0.12;
  const wheelGain = ()=>speed/4;

  let target = 0, current = 0, lastSeek = -1, heroReady = false, manifestReady = false, posterReady = false;
  let heroRaf = 0, pauseUntil = 0, lastAuto = 0, holdUntil = 0;
  const ease = reduceMotion ? 1 : 0.16;
  function seekHero(position){
    if(!video.duration) return true;
    const time = clamp(position,0,1)*(video.duration-0.04);
    if(Math.abs(time-lastSeek)<0.008) return true;
    if(video.seeking) return false;
    lastSeek = time;
    video.fastSeek ? video.fastSeek(time) : (video.currentTime = time);
    return true;
  }
  function tickHero(){
    heroRaf = 0;
    current += (target-current)*ease;
    if(Math.abs(target-current)<0.0004) current = target;
    const settled = seekHero(current);
    if(current !== target || !settled) heroRaf = requestAnimationFrame(tickHero);
  }
  function moveHero(position){
    target = clamp(position,0,1);
    hero.classList.add('used');
    if(!heroRaf) heroRaf = requestAnimationFrame(tickHero);
  }
  function scrubPointer(element, canStart, start, move, dragTarget){
    let pointer = null, x = 0, y = 0, base = 0, locked = false;
    element.addEventListener('pointerdown',event=>{
      if(event.pointerType === 'mouse' && event.button !== 0) return;
      delete dragTarget.dataset.drag;
      if(!canStart()) return;
      pointer=event.pointerId; x=event.clientX; y=event.clientY; base=start(); locked=false;
    });
    element.addEventListener('pointermove',event=>{
      if(event.pointerId !== pointer) return;
      const dx=event.clientX-x, dy=event.clientY-y;
      if(!locked){
        if(Math.abs(dx)<6 && Math.abs(dy)<6) return;
        if(Math.abs(dy)>Math.abs(dx)){ pointer=null; return; }
        locked=true; dragTarget.dataset.drag='1'; element.classList.add('dragging');
        try { element.setPointerCapture(event.pointerId); } catch(_){}
      }
      move(base,dx);
    });
    const end=event=>{ if(event.pointerId!==pointer) return; pointer=null; locked=false; element.classList.remove('dragging'); };
    ['pointerup','pointercancel','lostpointercapture'].forEach(type=>element.addEventListener(type,end));
  }

  scrubPointer(stage,()=>heroReady,()=>target,(base,dx)=>moveHero(base-dx/innerWidth*dragGain()*2),hero);
  addEventListener('wheel',event=>{
    if(!heroReady || event.ctrlKey || scrollY>2 || document.querySelector('.overlay.is-open') || document.querySelector('.app.menu-mode')) return;
    let delta=Math.abs(event.deltaX)>Math.abs(event.deltaY)?event.deltaX:event.deltaY;
    if(!delta) return;
    if(event.deltaMode===1) delta*=33; else if(event.deltaMode===2) delta*=innerHeight;
    const now=performance.now();
    if(now<holdUntil){ event.preventDefault(); return; }
    if((delta>0 && target>=1)||(delta<0 && target<=0)) return;
    event.preventDefault(); pauseUntil=now+2500;
    target=clamp(target+delta/2500*wheelGain()*2,0,1);
    if(target===0 || target===1) holdUntil=now+350;
    moveHero(target);
  },{passive:false});
  stage.addEventListener('pointerdown',()=>{ pauseUntil=Infinity; });
  ['pointerup','pointercancel'].forEach(type=>stage.addEventListener(type,()=>{pauseUntil=performance.now()+2500;}));
  function autoStep(timestamp){
    requestAnimationFrame(autoStep);
    const dt=lastAuto?Math.min((timestamp-lastAuto)/1000,0.1):0; lastAuto=timestamp;
    if(reduceMotion || !heroReady || !video.duration || scrollY>2 || document.hidden || timestamp<pauseUntil || document.querySelector('.app.menu-mode')) return;
    let next=target+dt/video.duration*(speed/4);
    if(next>=1){ next=0; current=0; lastSeek=-1; }
    target=next;
    if(!heroRaf) heroRaf=requestAnimationFrame(tickHero);
  }
  requestAnimationFrame(autoStep);

  const specialRow=document.getElementById('specialRow');
  const specialStates=new WeakMap();
  const maxLive=3;
  let liveRaf=0;
  function stateFor(card){
    let state=specialStates.get(card);
    if(state) return state;
    const element=card.querySelector('.special-video'), clip=element.querySelector('video'), bar=card.querySelector('.special-scrub i');
    state={card,element,clip,bar,items:SPECIAL_SECTIONS.find(section=>section.key===card.dataset.cat)?.items||[],priceLabel:card.querySelector('.special-add-price'),foodRows:[...card.querySelectorAll('.special-foods li')],pos:0,target:0,current:0,lastSeek:-1,raf:0,live:false};
    const duration=()=>clip.duration||0;
    function updateFeaturedProduct(){
      if(!state.items.length || !duration()) return;
      const index=Math.min(state.items.length-1,Math.floor(state.current*duration()/2));
      const item=state.items[index];
      state.card.dataset.idx=String(index);
      const price=Number(item?.price);
      state.priceLabel.textContent=Number.isFinite(price)?money(price):'';
      state.foodRows.forEach((food,rowIndex)=>food.classList.toggle('is-current',rowIndex===index));
    }
    function tick(){
      state.raf=0; state.current+=(state.target-state.current)*ease;
      if(Math.abs(state.target-state.current)<0.0004) state.current=state.target;
      state.bar.style.transform=`scaleX(${state.current})`;
      updateFeaturedProduct();
      let settled=true;
      if(duration()){
        const time=state.current*(duration()-0.04);
        if(Math.abs(time-state.lastSeek)>=0.008){
          if(clip.seeking) settled=false;
          else { state.lastSeek=time; clip.fastSeek?clip.fastSeek(time):(clip.currentTime=time); }
        }
      }
      if(state.current!==state.target || !settled) state.raf=requestAnimationFrame(tick);
    }
    const kick=()=>{if(!state.raf) state.raf=requestAnimationFrame(tick);};
    const goTo=position=>{if(!duration()) return; state.target=clamp(position,0,1); state.pos=state.target; specialRow.classList.add('hints-off'); kick();};
    clip.addEventListener('loadedmetadata',()=>{state.current=state.target=state.pos;state.lastSeek=-1;state.bar.style.transform=`scaleX(${state.current})`;updateFeaturedProduct();if(state.pos)kick();});
    clip.addEventListener('loadeddata',()=>{ if(!card.dataset.cover) setCover(card,clip); });
    clip.addEventListener('loadeddata',()=>clip.play().then(()=>{clip.pause();if(state.live){state.lastSeek=-1;kick();}}).catch(()=>{}));
    clip.addEventListener('error',()=>{
      if(state.live && clip.dataset.sourceKind==='bucket'){
        clip.dataset.sourceKind='fallback';
        clip.src='demo/food-360p.mp4';
      }
    });
    scrubPointer(element,()=>state.live&&duration()>0,()=>state.target,(base,dx)=>goTo(base-dx/element.clientWidth*dragGain()),card);
    element.addEventListener('wheel',event=>{
      if(!state.live || !duration() || Math.abs(event.deltaX)<=Math.abs(event.deltaY)) return;
      event.preventDefault(); goTo(state.target+event.deltaX/600*wheelGain());
    },{passive:false});
    specialStates.set(card,state);
    return state;
  }
  function setLive(state,on){
    if(state.live===on) return;
    state.live=on;
    if(on){
      const source=state.card.dataset.videoUrl;
      state.clip.preload='auto';
      state.clip.dataset.sourceKind=source?'bucket':'fallback';
      state.clip.src=source || 'demo/food-360p.mp4';
    }
    else{
      cancelAnimationFrame(state.raf);state.raf=0;state.lastSeek=-1;state.clip.pause();
      state.clip.removeAttribute('src');state.clip.load();state.bar.style.transform='scaleX(0)';
    }
  }
  function refreshLive(){
    liveRaf=0;
    if(!manifestReady || document.querySelector('.app.menu-mode') || !posterReady && scrollY<40) return;
    const cards=[...specialRow.querySelectorAll('.special-card')];
    if(!cards.length) return;
    const midpoint=innerHeight/2, view=innerHeight;
    const wanted=cards.map(card=>{const rect=card.getBoundingClientRect();return {state:stateFor(card),distance:Math.abs((rect.top+rect.bottom)/2-midpoint),near:rect.bottom>-view*.5&&rect.top<view*1.5};})
      .filter(item=>item.near).sort((a,b)=>a.distance-b.distance).slice(0,maxLive).map(item=>item.state);
    cards.forEach(card=>{const state=stateFor(card);if(!wanted.includes(state))setLive(state,false);});
    wanted.forEach(state=>setLive(state,true));
    pumpCovers(cards);
  }
  /* Cards that are near the viewport but not live get their first frame as cover, one video at a time. */
  let coverBusy=false;
  function captureCover(card){
    return new Promise(resolve=>{
      const v=document.createElement('video');
      v.muted=true; v.playsInline=true; v.preload='auto';
      let done=false, fellBack=!card.dataset.videoUrl;
      const finish=ok=>{
        if(done) return; done=true; clearTimeout(timer);
        if(ok) setCover(card,v);
        v.removeAttribute('src'); v.load(); resolve();
      };
      const timer=setTimeout(()=>finish(false),8000);
      v.addEventListener('loadeddata',()=>finish(true));
      v.addEventListener('error',()=>{
        if(fellBack) return finish(false);
        fellBack=true; v.src='demo/food-360p.mp4';
      });
      v.src=coverKey(card);
    });
  }
  function pumpCovers(cards){
    if(coverBusy) return;
    const midpoint=innerHeight/2;
    const next=cards
      .filter(card=>!card.dataset.cover && !card.dataset.coverTried && !stateFor(card).live)
      .map(card=>{const rect=card.getBoundingClientRect();return {card,distance:Math.abs((rect.top+rect.bottom)/2-midpoint),near:rect.bottom>-innerHeight*.5&&rect.top<innerHeight*1.5};})
      .filter(item=>item.near).sort((a,b)=>a.distance-b.distance)[0];
    if(!next) return;
    coverBusy=true; next.card.dataset.coverTried='1';
    captureCover(next.card).then(()=>{coverBusy=false; scheduleLive();});
  }
  function scheduleLive(){if(!liveRaf) liveRaf=requestAnimationFrame(refreshLive);}
  addEventListener('scroll',scheduleLive,{passive:true});
  addEventListener('resize',scheduleLive);
  scheduleLive();

  async function startHero(){
    try{
      const response=await fetch(`${API_BASE}/api/banner`,{cache:'no-store'});
      if(response.ok) VIDEO_MANIFEST=await response.json();
    }catch(_){}
    manifestReady=true;
    scheduleLive();
    if(VIDEO_MANIFEST.heroPosterUrl) video.poster=VIDEO_MANIFEST.heroPosterUrl;
    video.dataset.sourceKind=VIDEO_MANIFEST.heroUrl?'bucket':'fallback';
    video.src=VIDEO_MANIFEST.heroUrl || 'demo/hero.mp4';
    video.addEventListener('loadeddata',()=>{
      heroReady=true; target=current=0; lastSeek=-1; seekHero(0);
      scheduleLive();
    },{once:true});
    video.addEventListener('error',()=>{
      if(video.dataset.sourceKind==='bucket'){
        video.dataset.sourceKind='fallback';
        video.src='demo/hero.mp4'; video.load(); return;
      }
      heroReady=true; scheduleLive();
    });
    video.load();
    setTimeout(()=>{if(!heroReady){heroReady=true;scheduleLive();}},8000);
  }
  const kick=()=>[video,...[...specialRow.querySelectorAll('.special-card')].map(card=>card.querySelector('video'))].forEach(clip=>clip.play().then(()=>clip.pause()).catch(()=>{}));
  ['touchstart','pointerdown','wheel'].forEach(type=>addEventListener(type,kick,{once:true,passive:true}));
  // startHero();  // DISABLED: hero video moved to index.html
  // heroReady deliberately stays false: there is no hero to scrub on this page, so the wheel / touch
  // handlers above never hijack page scrolling. The special clips lazy-load as they approach the
  // viewport, but only after poster D has finished loading so it keeps the bandwidth first.
  manifestReady=true;
  const posterImg=document.querySelector('#posterD img');
  const posterDone=()=>{ if(posterReady) return; posterReady=true; scheduleLive(); };
  if(!posterImg || posterImg.complete) posterDone();
  else { posterImg.addEventListener('load',posterDone,{once:true}); posterImg.addEventListener('error',posterDone,{once:true}); setTimeout(posterDone,4000); }
})();
</script>
<!-- background music: track + on/off are set in Admin -> Music -->
<script src="music.js" data-page="menu" data-host=".floating" data-class="fab fab-music" defer></script>
</body>
